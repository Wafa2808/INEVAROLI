<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b4821a"/>
      <stop offset="100%" stop-color="#785006"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="35%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="blueGem" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redGem" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="80%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="yellowGem" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#422006"/>
    </linearGradient>
    <linearGradient id="greenGem" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#16a34a"/>
      <stop offset="80%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="purpleGem" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
  </defs>
  <rect width="500" height="500" fill="url(#bgGlow)"/>
  
  
  <g filter="url(#shadow)">
    
      <!-- Duo de Alianzas Clasicas Media Caña en Oro -->
      <ellipse cx="205" cy="245" rx="75" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
      <ellipse cx="295" cy="245" rx="75" ry="60" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
      
      
    
  </g>
</svg>